name: CKai - APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'scripts/verify-groq.mjs'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ckai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      apk_ready: ${{ steps.apk.outcome }}
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[phase-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparer Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Preparer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/package.json

      - name: Preparer Android
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Installer les dependances du moteur
        run: npm install --no-audit --fund=false

      - name: Tester le moteur IA
        run: npm test

      - name: Verifier les regles et la syntaxe des scripts
        run: npm run lint

      - name: Installer les dependances natives compatibles Expo
        working-directory: mobile
        env:
          CKAI_SKIP_PROVISION: '1'
        run: npm run setup

      - name: Tester les vrais imports PDF DOCX XLSX hors ligne
        working-directory: mobile
        run: npm run test:reader

      - name: Verifier la vraie reponse Groq
        if: env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run verify:groq

      - name: Preparer la configuration du build
        working-directory: mobile
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run provision

      - name: Verifier les types et compiler un APK autonome
        working-directory: mobile
        run: npm run apk

      - name: Conserver l'APK de test
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: CKai-Android-${{ github.run_number }}
          path: artifacts/CKai-test.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verifier la signature et la compatibilite de mise a jour
        run: node scripts/verify-apk-upgrade.mjs

      - name: Indiquer le resultat
        run: |
          echo '### APK CKai genere' >> "$GITHUB_STEP_SUMMARY"
          echo 'Telecharger l’artefact CKai-Android depuis cette execution, extraire le ZIP puis installer CKai-test.apk sur Android.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compilation terminee. Le test Groq est execute uniquement si le secret GROQ_API_KEY est configure. Le lancement sur un vrai telephone reste a verifier.' >> "$GITHUB_STEP_SUMMARY"

  smoke:
    if: ${{ always() && needs.build.outputs.apk_ready == 'success' }}
    name: Test Android et preuves visuelles
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: CKai-Android-${{ github.run_number }}
          path: artifacts
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparer la comparaison visuelle
        run: |
          python -m venv /tmp/ckai-visual-env
          /tmp/ckai-visual-env/bin/pip install --quiet 'Pillow>=11,<13'
      - name: Preparer les captures sans attente du repos
        run: node mobile/scripts/prepare-ui-dump.mjs
      - name: Preparer les vrais fichiers de test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p artifacts/fixtures
          cp mobile/assets/icon.png artifacts/fixtures/CKai-image-test.png
          ffmpeg -loglevel error -y -f lavfi -i 'color=c=0x7464B0:s=480x320:r=15' -vf 'drawtext=text=CKai:fontcolor=white:fontsize=56:x=(w-text_w)/2:y=(h-text_h)/2' -t 6 -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/CKai-video-test.mp4
      - name: Installer et ouvrir le vrai APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROOF_PHASE: after
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb push /tmp/ckai-ui-dump.jar /data/local/tmp/ckai-ui-dump.jar
            /tmp/ckai-visual-env/bin/python scripts/visual-audit.py
            /tmp/ckai-visual-env/bin/python scripts/android-v05.py
      - name: Afficher les erreurs de lancement
        if: always()
        shell: python
        run: |
          from pathlib import Path
          for name in ['artifacts/android-smoke/app-logcat.txt','artifacts/v05-proof/app-logcat.txt','artifacts/android-smoke/last-ui.xml']:
              path=Path(name)
              if path.exists(): print(name,path.read_text(errors='replace'))
      - name: Publier les captures synthetiques pour revue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_PHASE: after
        run: python scripts/publish-proofs.py
      - name: Conserver les captures et journaux de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CKai-verification-Android-${{ github.run_number }}
          path: |
            artifacts/android-smoke
            artifacts/visual-proof
            artifacts/v05-proof
          retention-days: 3
