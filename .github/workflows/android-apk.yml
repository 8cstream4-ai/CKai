name: CKai - APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'scripts/verify-groq.mjs'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: ckai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[phase-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparer Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Preparer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/package.json

      - name: Preparer Android
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Installer les dependances du moteur
        run: npm install --no-audit --fund=false

      - name: Tester le moteur IA
        run: npm test

      - name: Verifier les regles et la syntaxe des scripts
        run: npm run lint

      - name: Installer les dependances natives compatibles Expo
        working-directory: mobile
        env:
          CKAI_SKIP_PROVISION: '1'
        run: npm run setup

      - name: Tester les vrais imports PDF DOCX XLSX hors ligne
        working-directory: mobile
        run: npm run test:reader

      - name: Verifier la vraie reponse Groq
        if: env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run verify:groq

      - name: Preparer la configuration du build
        working-directory: mobile
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run provision

      - name: Verifier les types et compiler un APK autonome
        working-directory: mobile
        run: npm run apk

      - name: Conserver l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: CKai-Android-${{ github.run_number }}
          path: artifacts/CKai-test.apk
          if-no-files-found: error
          retention-days: 3

      - name: Indiquer le resultat
        run: |
          echo '### APK CKai genere' >> "$GITHUB_STEP_SUMMARY"
          echo 'Telecharger l’artefact CKai-Android depuis cette execution, extraire le ZIP puis installer CKai-test.apk sur Android.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compilation terminee. Le test Groq est execute uniquement si le secret GROQ_API_KEY est configure. Le lancement sur un vrai telephone reste a verifier.' >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Test Android et preuves visuelles
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: CKai-Android-${{ github.run_number }}
          path: artifacts
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparer la comparaison visuelle
        run: |
          python -m venv /tmp/ckai-visual-env
          /tmp/ckai-visual-env/bin/pip install --quiet 'Pillow>=11,<13'
      - name: Installer et ouvrir le vrai APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROOF_PHASE: after
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: /tmp/ckai-visual-env/bin/python scripts/visual-audit.py
      - name: Publier les captures synthetiques pour revue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_PHASE: after
        run: python scripts/publish-proofs.py
      - name: Conserver les captures et journaux de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CKai-verification-Android-${{ github.run_number }}
          path: |
            artifacts/android-smoke
            artifacts/visual-proof
          retention-days: 3
