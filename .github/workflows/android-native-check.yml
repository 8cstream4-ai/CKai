name: CKai - Verifier le service Android
on:
  push:
    branches: [main]
    paths: ['mobile/modules/**', '.github/workflows/android-native-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ckai-native-module-check
  cancel-in-progress: true
jobs:
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Installer Expo et generer le projet natif
        working-directory: mobile
        env:
          CKAI_SKIP_PROVISION: '1'
        run: |
          npm run setup
          npm run provision
          npx expo prebuild --platform android
      - name: Compiler le module et son manifeste
        working-directory: mobile/android
        run: ./gradlew :ckai-background:compileReleaseKotlin :ckai-background:processReleaseManifest
