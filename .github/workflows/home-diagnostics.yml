name: CKai - Diagnostic lancement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-diagnostics.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CKai-verification-Android-1
          run-id: 40665034922
          github-token: ${{ github.token }}
          path: diagnostic
      - name: Lire les diagnostics du lancement
        shell: python
        run: |
          from pathlib import Path
          for path in Path('diagnostic').rglob('*'):
              if path.suffix in ['.txt', '.xml']:
                  print('\nFILE',path,'\n',path.read_text(errors='replace'))
      - name: Publier les captures du diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_PHASE: after
        run: |
          mkdir -p artifacts/visual-proof/after
          find diagnostic -name '*.png' -exec cp {} artifacts/visual-proof/after/ \;
          python scripts/publish-proofs.py
