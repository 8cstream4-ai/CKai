name: CKai - Preuves Android
on:
  workflow_run:
    workflows: ['CKai - APK Android']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recuperer les preuves avant correction
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: CKai-V2-avant
          run-id: 40601088078
          github-token: ${{ github.token }}
          path: evidence/visual-proof
      - name: Recuperer les preuves du nouvel APK
        uses: actions/download-artifact@v4
        with:
          name: CKai-verification-Android-${{ github.event.workflow_run.run_number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: evidence
      - name: Decrire les fichiers
        run: |
          echo 'CKai Android : accueil avant/apres, imports photo/video et notifications.' > evidence/LIRE-MOI.txt
          echo 'Ouvrir visual-proof/before, visual-proof/after et v05-proof. Les donnees et le profil CKaiTest sont synthetiques.' >> evidence/LIRE-MOI.txt
          echo 'intro.mp4 enregistre le demarrage de l’accueil, la selection dune carte et la frappe. gfxinfo.txt contient la mesure de rendu de lemulateur.' >> evidence/LIRE-MOI.txt
          echo 'motion-checks.json documente les controles de stabilite en animations reduites et economie de batterie. Les mesures sur un telephone physique restent distinctes.' >> evidence/LIRE-MOI.txt
      - name: Installer les outils video
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verifier les fichiers video
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          result=[]
          for path in Path('evidence').rglob('*.mp4'):
              info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(path)]))
              duration=float(info['format']['duration'])
              assert duration>1, 'Recording is too short: '+str(path)
              result.append({'file':str(path.relative_to('evidence')),'durationSeconds':duration})
          assert result, 'No screen recordings were captured'
          Path('evidence/videos.json').write_text(json.dumps(result,indent=2))
          print('Valid screen recordings:',json.dumps(result))
      - uses: actions/upload-artifact@v4
        with:
          name: CKai-Preuves-Android
          path: evidence
          retention-days: 7
