name: CKai - Verification medias en ligne
on:
  push:
    branches: [main]
    paths: ['src/ai/media.ts', 'scripts/media-live.mjs', '.github/workflows/media-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verifier les vrais resultats sans cle IA
        run: node scripts/media-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CKai-medias-reels
          path: artifacts/media-live.json
          retention-days: 7
