name: CKai - Verification Android 05
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v05-check.yml', 'scripts/android-v05.py', 'mobile/scripts/android-smoke.py']
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    name: Test Android et preuves visuelles
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: CKai-Android-30
          run-id: 40690635044
          github-token: ${{ github.token }}
          path: artifacts
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparer la comparaison visuelle
        run: |
          python -m venv /tmp/ckai-visual-env
          /tmp/ckai-visual-env/bin/pip install --quiet 'Pillow>=11,<13'
      - name: Preparer les captures sans attente du repos
        run: node mobile/scripts/prepare-ui-dump.mjs
      - name: Preparer les vrais fichiers de test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p artifacts/fixtures
          cp mobile/assets/icon.png artifacts/fixtures/CKai-image-test.png
          ffmpeg -loglevel error -y -f lavfi -i 'color=c=0x7464B0:s=480x320:r=15' -vf 'drawtext=text=CKai:fontcolor=white:fontsize=56:x=(w-text_w)/2:y=(h-text_h)/2' -t 6 -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/fixtures/CKai-video-test.mp4
      - name: Installer et ouvrir le vrai APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROOF_PHASE: after
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb push /tmp/ckai-ui-dump.jar /data/local/tmp/ckai-ui-dump.jar
            adb shell wm size 786x1704
            adb shell wm density 320
            /tmp/ckai-visual-env/bin/python mobile/scripts/android-smoke.py
            /tmp/ckai-visual-env/bin/python scripts/notification-proof.py
      - name: Afficher les erreurs de lancement
        if: always()
        shell: python
        run: |
          from pathlib import Path
          for name in ['artifacts/android-smoke/app-logcat.txt','artifacts/v05-proof/app-logcat.txt','artifacts/android-smoke/last-ui.xml']:
              path=Path(name)
              if path.exists(): print(name,path.read_text(errors='replace'))
      - name: Publier les captures synthetiques pour revue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_PHASE: after
        run: python scripts/publish-proofs.py
      - name: Conserver les captures et journaux de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CKai-Preuves-Android-05
          path: |
            artifacts/android-smoke
            artifacts/visual-proof
            artifacts/v05-proof
          retention-days: 7

      - name: Verifier les enregistrements ecran
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          videos=[]
          for path in Path('artifacts').rglob('*.mp4'):
              if 'fixtures' in path.parts: continue
              info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(path)]))
              duration=float(info['format']['duration'])
              assert duration>1,str(path)
              videos.append({'file':str(path),'duration':duration})
          assert len(videos)>=1,'Expected a notification screen recording'
          print(json.dumps(videos))
